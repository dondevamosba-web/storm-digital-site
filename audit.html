<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Ads Audit — Storm Digital</title>
<meta name="description" content="Free paid-ads account audit for home-service contractors. We find the wasted spend in 48 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--night:#150f23;--canvas:#1f1633;--lime:#c2ef4e;--pink:#fa7faa;--violet-deep:#422082;
  --fg:#fff;--muted:rgba(255,255,255,.72);--faint:rgba(255,255,255,.18);
  --font-display:'Space Grotesk',sans-serif;--font-ui:'Rubik',sans-serif;--font-mono:'Space Mono',monospace}
*{margin:0;box-sizing:border-box}
body{background:var(--night);color:var(--fg);font-family:var(--font-ui);line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px}
.wordmark b{font-weight:700}.wordmark span span{color:var(--muted);font-weight:400}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--pink)}
h1{font-family:var(--font-display);font-size:clamp(32px,5vw,48px);line-height:1.08;margin:16px 0 14px}
.sub{color:var(--muted);font-size:18px;margin-bottom:36px}
form{background:var(--canvas);border:1px solid var(--faint);border-radius:24px;padding:36px;display:grid;gap:18px;margin-bottom:60px}
label{font-family:var(--font-display);font-size:15px;display:grid;gap:8px}
input,select,textarea{background:var(--night);border:1px solid var(--faint);border-radius:12px;color:#fff;
  padding:13px 16px;font-family:var(--font-ui);font-size:16px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);border-color:transparent}
button{background:var(--lime);color:var(--night);font-weight:700;font-family:var(--font-display);
  padding:16px;border:none;border-radius:999px;font-size:18px;cursor:pointer}
a{color:var(--lime);text-decoration:none}
.back{font-family:var(--font-mono);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">
      <svg width="17" height="23" viewBox="0 0 17 23" fill="none"><path d="M10.5 0L0 13h6.2l-2.4 10L17 8.5H9.3L12 0z" fill="#c2ef4e"/></svg>
      <span class="name"><b>Storm</b>&nbsp;<span>Digital</span></span>
    </div>
    <a class="back" href="index.html">← back</a>
  </header>

  <div class="eyebrow">Free · 48h turnaround</div>
  <h1>Get your ads account audited</h1>
  <p class="sub">Tell us where to look. Within 48 hours you get a teardown of wasted spend, tracking gaps and quick wins — yours to keep either way.</p>

  <form name="storm-audit" method="POST" action="https://formsubmit.co/carminattiguido@gmail.com">
    <input type="hidden" name="_subject" value="Storm audit request">
    <input type="hidden" name="_next" value="https://dondevamosba-web.github.io/storm-digital-site/thanks.html">
    <input type="hidden" name="_captcha" value="false">
    <label>Your name <input type="text" name="name" required></label>
    <label>Company <input type="text" name="company" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Phone (optional) <input type="tel" name="phone"></label>
    <label>Trade
      <select name="vertical" required>
        <option value="">Select…</option>
        <option>Roofing</option><option>HVAC</option><option>Plumbing</option>
        <option>Windows &amp; Doors</option><option>Other</option>
      </select>
    </label>
    <label>What are you running today?
      <select name="current_ads" required>
        <option value="">Select…</option>
        <option>Google Ads only</option><option>Meta Ads only</option>
        <option>Both</option><option>Nothing yet</option>
      </select>
    </label>
    <label>Anything specific you want us to look at? <textarea name="notes" rows="3"></textarea></label>
    <button type="submit">Send me the audit</button>
  </form>
</div>
</body>
</html>
